<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Docker Compose | Arquitectura Moderna</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .main-card {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideInUp 0.5s ease-out;
        }

        .main-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-weight: 300;
        }

        #resultado {
            background-color: #f8f9fa;
            border: 2px dashed #ddd;
            color: #e67e22; 
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease; 
            line-height: 1.4;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            background-color: #e67e22; 
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            transition: background-color 0.4s ease;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #bdc3c7;
            font-weight: 300;
        }
        
        @keyframes slideInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="main-card">
        <h1>¡Práctica Docker Exitosa!</h1>
        <p class="subtitle">Demostración de comunicación Frontend (Nginx) y Backend (Node.js)</p>
        
        <div id="resultado">
            <span class="status-dot" id="dot"></span>
            <span id="text-status">Esperando conexión con el backend...</span>
        </div>

        <p class="footer-text">Arquitectura de microservicios - Docker Compose hola</p>
    </div>

    <script>
        fetch('http://localhost:5000/api/mensaje')
            .then(response => response.json())
            .then(data => {
                const elementoTexto = document.getElementById('text-status');
                const elementoContenedor = document.getElementById('resultado');
                const bolitaEstado = document.getElementById('dot');

                elementoTexto.innerText = data.texto;
                
                elementoContenedor.style.borderColor = "#27ae60"; 
                elementoContenedor.style.backgroundColor = "#eafaf1"; 
                elementoContenedor.style.color = "#27ae60"; 
                bolitaEstado.style.backgroundColor = "#27ae60"; 
                
            })
            .catch(error => {
                const elementoTexto = document.getElementById('text-status');
                elementoTexto.innerText = "Error crítico al conectar con el backend.";
                console.error("Detalle:", error);
            });
    </script>
</body>
</html>
